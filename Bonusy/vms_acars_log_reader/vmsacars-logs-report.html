<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VMSACARS Logs Report</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: rgba(14, 20, 39, 0.88);
      --panel-2: rgba(18, 26, 49, 0.95);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #7dd3fc;
      --accent-2: #a78bfa;
      --ok: #34d399;
      --warn: #fbbf24;
      --err: #fb7185;
      --border: rgba(148, 163, 184, 0.18);
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(125, 211, 252, 0.18), transparent 26%),
        radial-gradient(circle at right 20%, rgba(167, 139, 250, 0.15), transparent 30%),
        linear-gradient(180deg, #0a0f1d 0%, #0b1020 45%, #050814 100%);
      min-height: 100vh;
    }
    .wrap { max-width: 1440px; margin: 0 auto; padding: 28px; }
    .hero {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(17, 24, 39, 0.78));
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }
    .eyebrow { text-transform: uppercase; letter-spacing: .18em; color: var(--accent); font-size: 12px; margin-bottom: 10px; }
    h1 { margin: 0; font-size: clamp(32px, 4vw, 54px); line-height: 1.02; }
    .sub { margin-top: 12px; color: var(--muted); max-width: 90ch; }
    .stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; margin-top: 22px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .stat-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .12em; }
    .stat-value { font-size: 28px; margin-top: 8px; font-weight: 700; }
    .toolbar {
      display: grid;
      grid-template-columns: 1.2fr .8fr .8fr auto;
      gap: 12px;
      margin: 18px 0;
    }
    .filepick {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(125, 211, 252, 0.18), rgba(167, 139, 250, 0.18));
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      user-select: none;
      min-height: 48px;
      white-space: nowrap;
    }
    .filepick input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    input, select {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      font: inherit;
      outline: none;
    }
    input::placeholder { color: #64748b; }
    .grid { display: grid; gap: 14px; margin-top: 14px; }
    .file {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
    }
    details.file {
      padding: 0;
    }
    details.file > summary {
      display: flex; justify-content: space-between; gap: 16px; align-items: start;
      padding: 18px 20px; border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, rgba(125, 211, 252, 0.08), transparent 48%);
      cursor: pointer;
      list-style: none;
    }
    details.file > summary::-webkit-details-marker { display:none; }
    .file h2 { margin: 0; font-size: 20px; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .badge { display: inline-flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 999px; background: rgba(125, 211, 252, 0.12); color: #cfefff; font-size: 12px; border: 1px solid rgba(125, 211, 252, 0.2); }
    .events { padding: 14px 16px 18px; max-height: 620px; overflow: auto; }
    .line {
      display: grid;
      grid-template-columns: 110px 90px 1fr;
      gap: 10px;
      align-items: start;
      padding: 8px 10px;
      border-radius: 12px;
      font-family: Consolas, "SFMono-Regular", ui-monospace, monospace;
      font-size: 12.8px;
      line-height: 1.5;
    }
    .line:nth-child(odd) { background: rgba(148, 163, 184, 0.05); }
    .line.kind-error { background: rgba(248, 113, 113, 0.14); border: 1px solid rgba(248, 113, 113, 0.25); }
    .line.kind-warning { background: rgba(251, 191, 36, 0.12); border: 1px solid rgba(251, 191, 36, 0.22); }
    .line.kind-waypoint { background: rgba(125, 211, 252, 0.10); }
    .line.kind-state { background: rgba(167, 139, 250, 0.08); }
    .line.kind-system { background: rgba(148, 163, 184, 0.08); }
    .line.kind-action { background: rgba(52, 211, 153, 0.08); }
    .ts { color: var(--accent); }
    .sev { font-weight: 700; }
    .sev.I { color: var(--ok); }
    .sev.D { color: var(--accent); }
    .sev.W { color: #fdba74; }
    .sev.E { color: #fda4af; }
    .line.kind-warning .sev.W,
    .line.kind-error .sev.E { color: #fff; }
    .kind-tag { display: inline-flex; align-items: center; margin-left: 8px; padding: 2px 8px; border-radius: 999px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; border: 1px solid transparent; }
    .kind-tag.waypoint { color: #bae6fd; background: rgba(56, 189, 248, 0.12); border-color: rgba(56, 189, 248, 0.2); }
    .kind-tag.state { color: #ddd6fe; background: rgba(167, 139, 250, 0.12); border-color: rgba(167, 139, 250, 0.2); }
    .kind-tag.error { color: #fecaca; background: rgba(239, 68, 68, 0.14); border-color: rgba(239, 68, 68, 0.24); }
    .kind-tag.warning { color: #fde68a; background: rgba(245, 158, 11, 0.14); border-color: rgba(245, 158, 11, 0.24); }
    .kind-tag.system { color: #e2e8f0; background: rgba(148, 163, 184, 0.10); border-color: rgba(148, 163, 184, 0.20); }
    .kind-tag.action { color: #bbf7d0; background: rgba(34, 197, 94, 0.12); border-color: rgba(34, 197, 94, 0.2); }
    .kind-tag.data { color: #dbeafe; background: rgba(59, 130, 246, 0.12); border-color: rgba(59, 130, 246, 0.2); }
    .empty { padding: 28px; color: var(--muted); }
    .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 16px; }
    .loaded { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
    .loaded .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.72);
      color: var(--text);
      font-size: 13px;
    }
    .summary ul { margin: 12px 0 0; padding-left: 18px; color: var(--muted); }
    .summary li { margin: 6px 0; }
    .error {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(251, 113, 133, 0.4);
      background: rgba(127, 29, 29, 0.35);
      color: #fecdd3;
      display: none;
      white-space: pre-wrap;
    }
    @media (max-width: 1100px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } .toolbar, .summary { grid-template-columns: 1fr; } .line { grid-template-columns: 96px 82px 1fr; } }
    @media (max-width: 720px) { .wrap { padding: 14px; } .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .line { grid-template-columns: 1fr; gap: 4px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="eyebrow">VMSACARS log overview</div>
      <h1>Single-file HTML report</h1>
      <div class="sub">This report bundles the logs in this folder into one self-contained page with quick stats, file summaries, and searchable raw lines. Daily flight logs are shown separately from the installer/update trace.</div>
      <div class="stats" id="stats"></div>
    </section>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Search file names or log lines" />
      <select id="fileFilter"><option value="all">All files</option></select>
      <select id="severityFilter"><option value="all">All severities</option><option value="I">Info</option><option value="D">Debug</option><option value="W">Warning</option><option value="E">Error</option></select>
      <label class="filepick" title="Load local log files">
        Browse
        <input id="fileInput" type="file" accept=".log,.txt,text/plain" multiple />
      </label>
    </div>

    <div class="summary" id="summary"></div>
    <div class="loaded" id="loaded"></div>
    <div class="error" id="errorBox"></div>
    <div class="card" id="emptyState" style="display:none;margin-top:14px;">No log files are currently loaded.</div>
    <div class="grid" id="files"></div>
  </div>

    const elStats = document.getElementById('stats');
    const elSummary = document.getElementById('summary');
    const elFiles = document.getElementById('files');
    const elLoaded = document.getElementById('loaded');
    const elEmptyState = document.getElementById('emptyState');
    const elErrorBox = document.getElementById('errorBox');
    const elSearch = document.getElementById('search');
    const elFileFilter = document.getElementById('fileFilter');
    const elSeverityFilter = document.getElementById('severityFilter');
    const elFileInput = document.getElementById('fileInput');

    const parseLines = (content) => content.split(/\r?\n/).filter(Boolean).map(line => {
      const m = line.match(/^([A-Z]):(\d{4})\s+(\d{2}:\d{2}:\d{2})\s+(.*)$/);
      if (m) return { sev: m[1], day: m[2], time: m[3], body: m[4], raw: line };
      return { sev: '', day: '', time: '', body: line, raw: line };
    });

    const normalizeContent = (content) => {
      if (typeof content === 'string') return content;
      if (content && typeof content.value === 'string') return content.value;
      return String(content ?? '');
    };

    const classifyLine = (line) => {
      const body = line.body.toLowerCase();
      if (line.sev === 'E' || /error|failed|exception|fatal/.test(body)) return 'error';
      if (line.sev === 'W' || /warn|warning/.test(body)) return 'warning';
      if (/going to next waypoint|waypoint/.test(body)) return 'waypoint';
      if (/state:|flight time|alt=|spd=|hdgt|hdgm/.test(body)) return 'state';
      if (/loaded pilot|logging into|loading\s+\d+\s+airlines|download|initialising|initialised|located valid manifest|update\.exe|retrieving latest release feed|no updates|found newer remote release|verifying package checksum|extracting new update\.exe/.test(body)) return 'system';
      if (/set to|scanning for arrival airport|entered\/crossing runway|landing gear|flaps|taxi lights/.test(body)) return 'action';
      return 'data';
    };

    const groupByDay = (lines) => {
      const map = new Map();
      for (const line of lines) {
        const key = line.day || 'misc';
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(line);
      }
      return [...map.entries()].map(([day, items]) => ({ day, items }));
    };

    let files = LOGS.map(f => ({
      ...f,
      content: normalizeContent(f.content),
      lines: parseLines(normalizeContent(f.content)),
      lineCount: normalizeContent(f.content).split(/\r?\n/).filter(Boolean).length,
      bytes: f.size
    }));

    function rebuildDerivedData() {
      const allLines = files.flatMap(f => f.lines.map(line => ({ ...line, file: f.name })));
      const flightFiles = files.filter(f => /^log\d+\.txt$/i.test(f.name));
      const installFile = files.find(f => f.name === 'install.log');
      return { allLines, flightFiles, installFile };
    }

    let { allLines, flightFiles, installFile } = rebuildDerivedData();

    const fileOptions = files.map(f => `<option value="${f.name}">${f.name}</option>`).join('');
    elFileFilter.insertAdjacentHTML('beforeend', fileOptions);

    elFileInput.addEventListener('change', async () => {
      const selected = [...elFileInput.files || []];
      if (!selected.length) return;
      const loaded = await Promise.all(selected.map(async file => ({
        name: file.name,
        size: file.size,
        modified: new Date(file.lastModified || Date.now()).toISOString().replace('T', ' ').replace('Z', ' UTC'),
        content: await file.text()
      })));
      files = loaded.map(f => ({
        ...f,
        content: normalizeContent(f.content),
        lines: parseLines(normalizeContent(f.content)),
        lineCount: normalizeContent(f.content).split(/\r?\n/).filter(Boolean).length,
        bytes: f.size
      }));
      const currentFilter = elFileFilter.value;
      elFileFilter.innerHTML = '<option value="all">All files</option>' + files.map(f => `<option value="${f.name}">${f.name}</option>`).join('');
      if (files.some(f => f.name === currentFilter)) elFileFilter.value = currentFilter;
      ({ allLines, flightFiles, installFile } = rebuildDerivedData());
      render();
    });

    function render() {
      try {
        ({ allLines, flightFiles, installFile } = rebuildDerivedData());
        const bySeverity = ['I','D','W','E'].map(sev => [sev, allLines.filter(l => l.sev === sev).length]);
        const topWaypoints = (() => {
          const seen = new Map();
          for (const line of allLines) {
            const m = line.body.match(/^Going to next waypoint:\s+(.*)$/);
            if (m) seen.set(m[1], (seen.get(m[1]) || 0) + 1);
          }
          return [...seen.entries()].sort((a,b)=>b[1]-a[1]).slice(0, 5);
        })();

        elStats.innerHTML = [
          ['Files', files.length],
          ['Daily logs', flightFiles.length],
          ['Total lines', allLines.length.toLocaleString()],
          ['Info lines', bySeverity[0][1].toLocaleString()],
          ['Debug lines', bySeverity[1][1].toLocaleString()],
          ['Install log lines', installFile ? installFile.lineCount.toLocaleString() : '0']
        ].map(([label, value]) => `<div class="card"><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div>`).join('');

        elSummary.innerHTML = [
          `<div class="card"><strong>Coverage</strong><ul>${files.map(f => `<li>${f.name}: ${f.lineCount.toLocaleString()} lines, ${Math.round(f.bytes/1024)} KB</li>`).join('')}</ul></div>`,
          `<div class="card"><strong>Severity mix</strong><ul>${bySeverity.map(([sev,count]) => `<li>${sev || 'N'}: ${count.toLocaleString()}</li>`).join('')}</ul></div>`,
          `<div class="card"><strong>Common waypoints</strong><ul>${topWaypoints.length ? topWaypoints.map(([wp,count]) => `<li>${wp} (${count})</li>`).join('') : '<li>No waypoint events found</li>'}</ul></div>`
        ].join('');

        elLoaded.innerHTML = files.map(f => `<div class="pill">${escapeHtml(f.name)} <span style="color:var(--muted)">${f.lineCount.toLocaleString()} lines</span></div>`).join('');

        const q = elSearch.value.trim().toLowerCase();
        const fileSel = elFileFilter.value;
        const sevSel = elSeverityFilter.value;
        const visible = files.filter(f => fileSel === 'all' || f.name === fileSel).map(f => {
          const lines = f.lines.filter(line => {
            const matchesSearch = !q || f.name.toLowerCase().includes(q) || line.raw.toLowerCase().includes(q);
            const matchesSeverity = sevSel === 'all' || line.sev === sevSel;
            return matchesSearch && matchesSeverity;
          }).slice(0, 100);
          return { ...f, lines };
        }).filter(f => f.lines.length > 0 || !q);

        elEmptyState.style.display = visible.length ? 'none' : 'block';
        elFiles.innerHTML = visible.map(f => {
          const sections = groupByDay(f.lines);
          const body = f.lines.length
            ? sections.map(section => {
                const sectionCounts = section.items.reduce((acc, line) => { acc[line.sev || ''] = (acc[line.sev || ''] || 0) + 1; return acc; }, {});
                const linesHtml = section.items.map(line => {
                  const kind = classifyLine(line);
                  const tag = kind !== 'data' ? `<span class="kind-tag ${kind}">${kind}</span>` : '';
                  return `<div class="line kind-${kind}"><div class="ts">${line.day || '&nbsp;'} ${line.time || ''}</div><div class="sev ${line.sev}">${line.sev || '&nbsp;'}</div><div>${escapeHtml(line.body)}${tag}</div></div>`;
                }).join('');
                const chips = Object.entries(sectionCounts).filter(([k]) => k).map(([k,v]) => `<span class="badge" style="margin-left:8px;background:rgba(255,255,255,0.06)">${k}:${v}</span>`).join('');
                return `<div class="card" style="margin:12px 0 0;padding:0;"><div style="padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;"><strong>${section.day === 'misc' ? 'Unclassified' : 'Date ' + section.day}</strong><div>${chips}</div></div><div class="events" style="max-height:none;">${linesHtml}</div></div>`;
              }).join('')
            : '<div class="empty">No matching lines.</div>';
          return `<details class="file" open><summary><div><h2>${escapeHtml(f.name)}</h2><div class="meta">${f.lineCount.toLocaleString()} lines total · ${Math.round(f.bytes/1024)} KB · modified ${escapeHtml(f.modified)}</div></div><div class="badge">${f.name === 'install.log' ? 'installer / update trace' : 'daily flight log'}</div></summary><div class="events">${body}</div></details>`;
        }).join('') || '<div class="card">No files match the current filters.</div>';
        elErrorBox.style.display = 'none';
      } catch (err) {
        elErrorBox.textContent = String(err && err.stack ? err.stack : err);
        elErrorBox.style.display = 'block';
      }
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));
    }

    [elSearch, elFileFilter, elSeverityFilter].forEach(el => el.addEventListener('input', render));
    render();
  </script>
</body>
</html>
