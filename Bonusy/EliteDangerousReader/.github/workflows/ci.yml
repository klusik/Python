name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks on Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run Ruff
        run: |
          ruff check src tests run_elite_reader.py
          ruff format --check src tests run_elite_reader.py

      - name: Run mypy
        run: mypy

      - name: Run tests
        run: pytest

  build:
    name: Build Windows executable
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Build executable
        run: pyinstaller --noconfirm --clean EliteDangerousReader.spec

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: EliteDangerousReader-Windows
          path: dist/EliteDangerousReader.exe
          if-no-files-found: error
