[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elite-dangerous-reader"
version = "1.0.0"
description = "Single-purpose Edge WebView2 reader for elitedangerous.com with configurable readability overrides."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Rudolf Klusal" }
]
dependencies = [
    "pywebview==6.2.1"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers"
]

[project.scripts]
elite-reader = "elite_reader.__main__:main"

[project.optional-dependencies]
dev = [
    "mypy==2.3.0",
    "pyinstaller==6.21.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.21"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elite_reader = ["assets/*.js"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=elite_reader --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D202", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["elite_reader"]
ignore_missing_imports = true
warn_unused_ignores = true
